name: Deploy Production

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, redis, bcmath, gd
          coverage: none

      - name: Copy .env
        run: |
          cd backend
          cp .env.example .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=root_password/' .env
          sed -i 's/DB_DATABASE=tuition_management/DB_DATABASE=testing/' .env

      - name: Install Composer dependencies
        run: cd backend && composer install --prefer-dist --no-progress --no-interaction

      - name: Generate application key
        run: cd backend && php artisan key:generate

      - name: Run migrations
        run: cd backend && php artisan migrate --force

      - name: Run tests
        run: cd backend && php artisan test

  build:
    name: Build Docker Image
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/tuition-management:latest
            ${{ secrets.DOCKER_USERNAME }}/tuition-management:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tuition-management:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/tuition-management:buildcache,mode=max

  deploy:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT }}
          script: |
            cd /var/www/tuition-management

            # Pull latest changes
            git pull origin main

            # Pull latest Docker images
            docker-compose pull

            # Run database migrations
            docker-compose exec -T app php artisan migrate --force

            # Clear and cache config
            docker-compose exec -T app php artisan config:cache
            docker-compose exec -T app php artisan route:cache
            docker-compose exec -T app php artisan view:cache

            # Restart services
            docker-compose up -d --force-recreate

            # Restart queue workers
            docker-compose exec -T app php artisan queue:restart

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.PRODUCTION_URL }}/health || exit 1

      - name: Notify deployment success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify deployment failure
        if: failure()
        run: echo "Deployment failed!"
